<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - Banc de Temps</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h2 class="text-center text-success mb-4">Crea el teu compte</h2>
                        <p class="text-center text-muted mb-4">Rebràs 5 hores de saldo inicial de benvinguda!</p>

                        {% include '_flash.html' %}

                        <!-- Formulari que enviarà les dades a la ruta /registre -->
                        <form method="POST" action="/registre">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label class="form-label text-muted">Nom complet</label>
                                <input type="text" name="nom" class="form-control form-control-lg" placeholder="Com et dius?" value="{{ form.get('nom', '') }}" minlength="2" maxlength="60" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ciutat o Població</label>
                                <select class="form-select" name="ciutat" required>
                                    <option value="" {% if not form.get('ciutat') %}selected{% endif %} disabled>-- Selecciona on vius --</option>
                                    {% for c in CIUTATS %}
                                        <option value="{{ c }}" {% if form.get('ciutat') == c %}selected{% endif %}>{{ c if c != 'Altres' else 'Altres poblacions...' }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Correu electrònic</label>
                                <input type="email" name="correu" class="form-control form-control-lg" placeholder="nom@exemple.cat" value="{{ form.get('correu', '') }}" maxlength="120" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">Contrasenya</label>
                                <input type="password" name="contrasenya" class="form-control form-control-lg" minlength="8" maxlength="128" required>
                                <small class="text-muted">Mínim 8 caràcters.</small>
                            </div>

                            <div class="mb-4">
                                <label>
                                    <input type="checkbox" name="normes" value="on" required>
                                    He llegit i accepto les <a href="/normes" target="_blank" class="fw-bold">Normes d'Ús</a>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg w-100">Registrar-me ara</button>
                        </form>

                        <!-- Enllaç per tornar a l'inici de sessió -->
                        <div class="text-center mt-4">
                            <p class="mb-0">Ja formes part del banc? <a href="/login" class="text-decoration-none fw-bold text-success">Inicia sessió</a></p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
