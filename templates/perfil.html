<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Meu Perfil - Banc de Temps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegació unificada -->
    <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/mercat">⏳ Banc de Temps</a>
            
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/mercat">Mercat</a></li>
                <li class="nav-item"><a class="nav-link" href="/crear_oferta">Crear Oferta</a></li>
                <li class="nav-item"><a class="nav-link" href="/transferencia">Pagar Hores</a></li>
                <li class="nav-item"><a class="nav-link" href="/historial">Historial</a></li>
                <li class="nav-item"><a class="nav-link" href="/xat">Xats 💬</a></li>
            </ul>
            
            <ul class="navbar-nav align-items-center">
                <li class="nav-item me-3">
                    <span class="navbar-text text-white fw-bold">Saldo: {{ saldo }}h</span>
                </li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="/perfil">Perfil</a></li>
                <li class="nav-item"><a class="btn btn-outline-light btn-sm ms-2" href="/logout">Sortir</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h3 class="text-primary border-bottom pb-2 mb-4">Configuració del Perfil</h3>
                        
                        <form method="POST" action="/perfil">
                            <div class="text-center mb-4">
                                <div class="bg-secondary rounded-circle d-inline-block" style="width: 120px; height: 120px; line-height: 120px; color: white; font-size: 3rem;">
                                    👤
                                </div>
                                <div class="mt-2">
                                    <span class="text-muted small">Correu electrònic: <strong>{{ usuari[1] }}</strong></span>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted">Nom a mostrar</label>
                                    <input type="text" name="nom" class="form-control" value="{{ usuari[0] }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted">Ubicació (Ciutat / Barri)</label>
                                    <input type="text" name="ciutat" class="form-control" value="{{ usuari[2] }}" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted">Sobre mi (Descripció)</label>
                                <textarea name="descripcio" class="form-control" rows="4" placeholder="Explica a la comunitat quine habilitats tens o què t'agrada fer...">{{ usuari[3] if usuari[3] else '' }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Guardar Canvis</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
