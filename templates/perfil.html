{# perfil.html — Edició del perfil de l'usuari. -#}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Meu Perfil - Banc de Temps</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
{% set actiu = 'perfil' %}
{% include '_navbar.html' %}

    <div class="container bt-pagina">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bt-card border-0">
                    <div class="card-body bt-card-cos">
                        <h3 class="bt-titol-card border-bottom pb-3 mb-4">Configuració del Perfil</h3>

                        {% include '_flash.html' %}

                        <form method="POST" action="/perfil">
                            <div class="text-center mb-4">
                                <div class="bt-avatar">
                                    👤
                                </div>
                                <div class="mt-3">
                                    <span class="bt-correu-perfil">Correu electrònic: <strong>{{ usuari[1] }}</strong></span>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nom" class="form-label fw-bold">Nom a mostrar</label>
                                    <input type="text" name="nom" id="nom" class="form-control form-control-lg" value="{{ usuari[0] }}" minlength="2" maxlength="60" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="ciutat" class="form-label fw-bold">Ciutat o Població</label>
                                    <select class="form-select form-control-lg" name="ciutat" id="ciutat" required>
                                        {% for c in CIUTATS %}
                                            <option value="{{ c }}" {% if usuari[2] == c or (c == 'Altres' and usuari[2] not in CIUTATS) %}selected{% endif %}>{{ c if c != 'Altres' else 'Altres poblacions...' }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="descripcio" class="form-label fw-bold">La meva descripció</label>
                                <textarea name="descripcio" id="descripcio" class="form-control" rows="4" maxlength="500" placeholder="Escriu alguna cosa sobre tu...">{{ usuari[3] or '' }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Guardar Canvis</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="/normes" class="text-secondary small" style="text-decoration: underline;">Llegir les Normes d'Ús</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
