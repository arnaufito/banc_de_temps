{# error.html — Pàgina d'error genèrica (el codi i el missatge els envia app.py). -#}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ codi }} - Banc de Temps</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

    {% if jo %}
        {% include '_navbar.html' %}
    {% endif %}

    <div class="container bt-pagina">
        <div class="bt-error text-center">
            <div class="bt-error-codi" aria-hidden="true">{{ codi }}</div>
            <h1 class="bt-h2-gran text-danger mb-3">Error {{ codi }}</h1>
            <p class="lead bt-error-missatge">{{ missatge }}</p>
            <a href="/" class="btn btn-primary btn-lg mt-3">Tornar a l'inici</a>
        </div>
    </div>

</body>
</html>
