<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inici de Sessió - Banc de Temps</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="bt-auth-cap">
        <div class="container text-center">
            <a href="/" class="bt-auth-marca"><span class="bt-moneda-mini">1 h</span> Banc de Temps</a>
            <p class="bt-auth-lema">La teva hora val tant com la de qualsevol altra persona</p>
        </div>
    </div>

    <div class="container bt-auth-contingut">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card bt-card border-0">
                    <div class="card-body bt-card-cos">
                        <h2 class="text-center bt-titol-card mb-4">Inicia Sessió</h2>

                        {% include '_flash.html' %}

                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label class="form-label">Correu electrònic</label>
                                <input type="email" name="correu" class="form-control form-control-lg" placeholder="nom@exemple.cat" value="{{ correu or '' }}" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Contrasenya</label>
                                <input type="password" name="contrasenya" class="form-control form-control-lg" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar al Banc</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="mb-3">No tens compte? <a href="/registre" class="text-decoration-none fw-bold">Crea'n un aquí</a></p>
                            <a href="/normes" class="text-secondary small" style="text-decoration: underline;">Llegir les Normes d'Ús</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
